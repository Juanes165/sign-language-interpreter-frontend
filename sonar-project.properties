# SonarQube Project Configuration
sonar.projectKey=sign-language-interpreter-frontend
sonar.projectName=Sign Language Interpreter Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions for analysis (archivos que no se analizarán)
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/__tests__/**,**/node_modules/**,**/.next/**,**/coverage/**,**/*.d.ts

# Coverage exclusions (archivos excluidos del reporte de cobertura)
sonar.coverage.exclusions=\
  **/page.js,\
  **/layout.js,\
  **/route.js,\
  **/index.js,\
  **/modelConfig.js,\
  **/useContributeCapture.js,\
  **/useGestureRecognitionLSTM.js,\
  **/saveToBackend.js,\
  **/components/**/index.js,\
  **/lib/index.js,\
  **/utils/index.js,\
  **/hooks/index.js

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/.next/**,**/coverage/**

# Language and coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript/JavaScript settings
sonar.javascript.environments=node,jsdom

# Code duplication exclusions
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx,**/__tests__/**,**/node_modules/**,**/.next/**
